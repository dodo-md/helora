name: Alpha Release

on:
  push:
    branches:
      - main
    # Docs-only and CI-only merges shouldn't ship a new alpha. Use the manual
    # trigger below to build one from a workflow change when needed.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "fastlane/**"
      - "metadata/**"
      - "LICENSE"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute alpha version
        id: version
        run: |
          BASE_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          BASE_CODE="$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)"
          ALPHA_VERSION="${BASE_VERSION}-alpha.${{ github.run_number }}"
          # Keeps version codes ordered across stable bumps: 0.2.0 alphas sit in the
          # 2xxxxx range, 0.3.0 alphas in 3xxxxx, so alpha updates always install.
          ALPHA_CODE="$(( BASE_CODE * 100000 + ${{ github.run_number }} ))"
          echo "name=$ALPHA_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$ALPHA_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$ALPHA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # A release signed with a different key cannot install over the last one, and
      # there is no way back once a wrong signature has been published. So the key
      # comes from repo secrets and a missing secret fails the run: the old fallback
      # generated a throwaway key per run, which silently shipped releases that could
      # never update each other.
      - name: Set up signing keystore
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          CI_KEYSTORE_ALIAS: ${{ secrets.CI_KEYSTORE_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          for name in CI_KEYSTORE_B64 CI_KEYSTORE_PASSWORD CI_KEYSTORE_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          printf '%s' "$CI_KEYSTORE_B64" | base64 -d > helora-release.jks
          {
            echo "storeFile=helora-release.jks"
            echo "storePassword=$CI_KEYSTORE_PASSWORD"
            echo "keyAlias=$CI_KEYSTORE_ALIAS"
            # Most keystores reuse the store password for the key.
            echo "keyPassword=${CI_KEY_PASSWORD:-$CI_KEYSTORE_PASSWORD}"
          } > keystore.properties

      - name: Build alpha release APKs
        run: >
          ./gradlew :app:assembleRelease
          -Phelora.enableAbiSplits=true
          -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}
          -PAPP_VERSION_CODE=${{ steps.version.outputs.code }}

      - name: Verify and rename split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p release-apks
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
            cp "$apk" "release-apks/Helora-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          --prerelease
          --generate-notes
          --title "helora ${{ steps.version.outputs.name }} 🌌"
          release-apks/*.apk
